name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (universal)
    # macos-15 defaults to Xcode 16.4 (Swift 6.1) but carries 26.x alongside
    # it, which the next step selects. macos-14 tops out at Xcode 16.2 and is
    # deprecated in late 2026 anyway.
    #
    # One job, not an arch matrix: create-app-bundle.sh cross-compiles both
    # slices and lipos them into a single universal bundle. Sparkle's appcast
    # has no architecture filtering, so shipping one artifact is the only way
    # both Apple Silicon and Intel users can auto-update from one <enclosure>.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.x (must match the toolchain releases are developed on)
        # Not the runner default (16.4 / Swift 6.1) and not "whatever is
        # newest". Both are wrong for a release path:
        #
        # A toolchain *older* than the maintainer's rejects code that compiles
        # fine locally, and the failure surfaces only after a tag is pushed.
        # machook lost its first v0.1.0 tag to exactly that — a switch over an
        # Optional<Bool> that is exhaustive from Swift 6.2 but not 6.1.
        #
        # "Newest available" is no better: the images carry Xcode previews, and
        # a release should never be the first thing to try one.
        #
        # So pin the major and let patch releases through. Bump this when the
        # local Xcode moves — the runner image tracks the same builds (26.3
        # 17C529 as of this writing).
        run: |
          xcode_path=""
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -rV); do
            if [ -d "$candidate" ]; then
              xcode_path="$candidate"
              break
            fi
          done
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26.x found on the runner. Available Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          echo "Selected: $xcode_path"

      - name: Show Swift version
        run: swift --version

      - name: Import code signing certificate
        if: env.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # cloudflared is fetched by create-app-bundle.sh, which downloads both
      # macOS slices and lipos them. Doing it there rather than here keeps one
      # implementation for CI and local builds, and the bundler is the only
      # place that knows how many architectures this build has to cover.

      - name: Build universal .app bundle
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          TARGET_ARCH: universal
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          chmod +x create-app-bundle.sh
          ./create-app-bundle.sh

      - name: Verify universal slices
        # create-app-bundle.sh already fails on a thin binary; this repeats the
        # check as a release gate so a regression in the bundler can't quietly
        # ship a half-architecture build.
        run: |
          fail=0
          for bin in \
            "iMessage Relay.app/Contents/MacOS/ImsgRelay" \
            "iMessage Relay.app/Contents/Resources/cloudflared" \
            "iMessage Relay.app/Contents/Frameworks/Sparkle.framework/Versions/Current/Sparkle"
          do
            if [ ! -f "$bin" ]; then
              echo "::error::missing binary: $bin"; fail=1; continue
            fi
            archs="$(lipo -archs "$bin" 2>/dev/null || echo unknown)"
            echo "$bin → $archs"
            case "$archs" in
              *arm64*) ;;
              *) echo "::error::$bin is missing the arm64 slice ($archs)"; fail=1 ;;
            esac
            case "$archs" in
              *x86_64*) ;;
              *) echo "::error::$bin is missing the x86_64 slice ($archs)"; fail=1 ;;
            esac
          done
          exit $fail

      - name: Verify code signature (best effort)
        run: |
          codesign --verify --deep --strict --verbose=2 "iMessage Relay.app" || true
          spctl -a -vvv -t install "iMessage Relay.app" || echo "::warning::Gatekeeper assessment failed (expected without notarization)"

      - name: Notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "iMessage Relay.app" imsg-relay-notarize.zip
          xcrun notarytool submit imsg-relay-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "iMessage Relay.app"
          xcrun stapler validate "iMessage Relay.app"
          rm imsg-relay-notarize.zip

      - name: Package ZIP
        # This ZIP is both the download link and the Sparkle enclosure, so its
        # name is referenced by the appcast job below.
        run: |
          ditto -c -k --sequesterRsrc --keepParent "iMessage Relay.app" "imsg-relay-universal.zip"
          shasum -a 256 "imsg-relay-universal.zip" > "imsg-relay-universal.zip.sha256"

      - name: Package DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "iMessage Relay" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "iMessage Relay.app" 175 120 \
            --hide-extension "iMessage Relay.app" \
            --app-drop-link 425 120 \
            "imsg-relay-universal.dmg" \
            "iMessage Relay.app" || true
          if [ -f "imsg-relay-universal.dmg" ]; then
            shasum -a 256 "imsg-relay-universal.dmg" > "imsg-relay-universal.dmg.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imsg-relay-universal
          path: |
            imsg-relay-universal.zip
            imsg-relay-universal.zip.sha256
            imsg-relay-universal.dmg
            imsg-relay-universal.dmg.sha256
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## iMessage Relay ${{ github.ref_name }}

            macOS menu bar app that turns a Mac into an iMessage gateway.

            ### Downloads

            One universal build for both Apple Silicon and Intel:
            `imsg-relay-universal.dmg` or `imsg-relay-universal.zip`.

            ### Install

            1. Download the right file for your Mac.
            2. Mount the DMG (or unzip) and drag **iMessage Relay.app** to **Applications**.
            3. Grant Full Disk Access (System Settings → Privacy & Security) so the relay can read `chat.db`.
            4. On first send, grant Automation → Messages.
            5. Open Settings from the menu bar icon and set your server endpoint + bearer token.

            ### Verification

            ```bash
            shasum -a 256 -c imsg-relay-universal.zip.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appcast:
    name: Update appcast.xml
    needs: release
    runs-on: macos-15
    # The `env` context isn't available in job-level `if:` conditions
    # (chicken-and-egg with the job's own `env:` block) and referencing
    # `secrets.X != ''` in an `if:` is also unreliable, so we let the
    # job always run on tag pushes and fail loudly in the first step
    # below if the Sparkle key isn't configured. That's the right
    # behavior: missing key on a tag push is a maintainer config error,
    # not an optional flow.
    if: startsWith(github.ref, 'refs/tags/')
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
    steps:
      - name: Verify Sparkle private key is configured
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set."
            echo "::error::Generate a keypair with ./scripts/sparkle-keygen.sh and add both halves to:"
            echo "::error::  Repository Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::See docs/DISTRIBUTION.md § 1.1 for the full one-time setup."
            exit 1
          fi
          echo "Sparkle key length: ${#SPARKLE_ED_PRIVATE_KEY} chars — OK."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version out of the built app
        id: meta
        # Read the versions from the ZIP we are about to sign, never from
        # src/Info.plist. Sparkle checks the appcast's <sparkle:version>
        # against the installed app's CFBundleVersion, so if those two are
        # derived from different places they drift and the updater concludes
        # every user is already up to date. That is exactly what shipped:
        # 0.1.2, 0.1.3 and 0.1.4 all advertised build 3 from this file while
        # the apps themselves carried the commit count (0.1.4 was build 47),
        # so no installed copy was ever offered an update. Describing the
        # artifact makes that class of bug impossible.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          ZIP="$(find artifacts -name 'imsg-relay-universal.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::imsg-relay-universal.zip not found in artifacts."
            find artifacts -type f | head -20
            exit 1
          fi

          workdir="$(mktemp -d)"
          ditto -x -k "$ZIP" "$workdir"
          plist="$workdir/iMessage Relay.app/Contents/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "::error::no iMessage Relay.app/Contents/Info.plist inside $ZIP"
            find "$workdir" -maxdepth 2 | head -20
            exit 1
          fi

          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          MIN_SYSTEM="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")"
          echo "tag=$TAG_VERSION  bundle short=$SHORT_VERSION  CFBundleVersion=$BUILD_NUMBER  min system=$MIN_SYSTEM"

          if [ "$SHORT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION but the bundle says $SHORT_VERSION — the version never reached create-app-bundle.sh."
            exit 1
          fi

          # The app can only install an update whose signature verifies against
          # the key baked into the copy already on disk. If the shipped key and
          # the signing key ever drift apart, every download is rejected at the
          # last moment with nothing in the release log to explain it — so
          # compare them here, while we can still fail the release instead.
          SHIPPED_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist" 2>/dev/null || echo '')"
          if [ -z "$SHIPPED_KEY" ]; then
            echo "::error::the built app has no SUPublicEDKey — it could never verify an update."
            exit 1
          fi
          if [ -n "$SPARKLE_ED_PUBLIC_KEY" ] && [ "$SHIPPED_KEY" != "$SPARKLE_ED_PUBLIC_KEY" ]; then
            echo "::error::the app ships a different Sparkle public key than the SPARKLE_ED_PUBLIC_KEY secret."
            echo "::error::src/Info.plist and the repository secrets disagree; updates signed here would be rejected."
            exit 1
          fi

          echo "version=$SHORT_VERSION"      >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER"  >> "$GITHUB_OUTPUT"
          echo "min_system=$MIN_SYSTEM"      >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP"                    >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26.x (same toolchain as the build job)
        # This job compiles the package too, so it needs the same compiler as
        # the build job. On the runner default it would fail on code the build
        # job accepted — after the release is already published, leaving a
        # release with no appcast entry and therefore no way to auto-update to.
        run: |
          xcode_path=""
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -rV); do
            if [ -d "$candidate" ]; then
              xcode_path="$candidate"
              break
            fi
          done
          if [ -z "$xcode_path" ]; then
            echo "::error::No Xcode 26.x found on the runner. Available Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          echo "Selected: $xcode_path"

      - name: Build Sparkle helpers (need sign_update binary)
        run: |
          cd src && swift build -c release --product ImsgRelay
          # The build produces Sparkle's bundle with sign_update inside.

      - name: Append release to appcast.xml
        run: |
          # Sparkle's <enclosure> is one-per-channel with no architecture
          # filtering, which is exactly why the build job ships a single
          # universal ZIP: this one URL is correct for every Mac that can run
          # the app. Until 0.1.4 this pushed the arm64 build under a comment
          # claiming Sparkle would pick a matching slice — it does not, and
          # there was no universal binary to pick from. The signature is
          # computed over the same ZIP that gets published, so the file
          # Sparkle downloads is byte-identical to the release asset.
          ZIP="${{ steps.meta.outputs.zip }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

          ./scripts/appcast-add.sh \
            --zip "$ZIP" \
            --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build_number }}" \
            --min-system "${{ steps.meta.outputs.min_system }}" \
            --download-url "$BASE_URL/imsg-relay-universal.zip" \
            --notes-url "$NOTES_URL"

      - name: Commit + push appcast.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet appcast.xml; then
            echo "appcast.xml unchanged — nothing to commit."
            exit 0
          fi
          git add appcast.xml
          git commit -m "chore(release): update appcast for ${{ github.ref_name }}"
          git push origin main
